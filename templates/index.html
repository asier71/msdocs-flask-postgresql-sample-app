{% extends "base.html" %}
{% block title %}Imágenes procesadas{% endblock %}

{% block head %}
  {{ super() }}
  <link rel="stylesheet" href="https://cdn.datatables.net/1.11.5/css/dataTables.bootstrap5.min.css">
  <style>
    .scala-brand {
      color: #de3423;
      font-weight: bold;
    }
    .table-responsive {
      background-color: white;
      border-radius: 5px;
      padding: 15px;
      box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
    }
    .btn-image {
      margin-right: 5px;
    }
  </style>
{% endblock %}

{% block content %}
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="scala-brand"><i class="fas fa-table me-2"></i>Imágenes procesadas</h1>
    <span class="badge bg-secondary" id="total-registros">Cargando...</span>
  </div>

  <div id="contenido-tabla" class="table-responsive"></div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.11.5/js/dataTables.bootstrap5.min.js"></script>
  <script>
    async function cargarDatos() {
      try {
        const response = await fetch('/datos');
        const datos = await response.json();
        document.getElementById('total-registros').textContent = `${datos.length} registros`;

        if (datos.length === 0) {
          document.getElementById('contenido-tabla').innerHTML = `
            <div class="alert alert-info">
              No hay registros aún. Sube imágenes desde la aplicación Scala.
            </div>`;
          return;
        }

        const tablaHtml = `
          <table id="tabla" class="table table-striped table-hover">
            <thead>
              <tr>
                <th>Usuario</th>
                <th>Nombre de archivo</th>
                <th>Rojo</th>
                <th>Verde</th>
                <th>Azul</th>
                <th>Fecha</th>
                <th>Imágenes</th>
              </tr>
            </thead>
            <tbody>
              ${datos.map(r => `
                <tr>
                  <td>${r.usuario}</td>
                  <td>${r.nombreArchivo}</td>
                  <td>${r.rojo}</td>
                  <td>${r.verde}</td>
                  <td>${r.azul}</td>
                  <td>${new Date(r.fechaHora).toLocaleString()}</td>
                  <td>
                    ${r.hasOriginal 
                      ? `<a href="/imagenes/${r.id}/original.bmp" target="_blank" class="btn btn-outline-primary btn-sm btn-image">Original</a>` 
                      : `<span class="text-muted small me-2"><i class="fas fa-times-circle text-danger"></i> Sin original</span>`}
                      
                    ${r.hasByn 
                      ? `<a href="/imagenes/${r.id}/byn.bmp" target="_blank" class="btn btn-outline-dark btn-sm btn-image">B/N</a>` 
                      : `<span class="text-muted small me-2"><i class="fas fa-times-circle text-danger"></i> Sin B/N</span>`}
                      
                    ${r.hasPixelada 
                      ? `<a href="/imagenes/${r.id}/pixelada.bmp" target="_blank" class="btn btn-outline-secondary btn-sm btn-image">Pixelada</a>` 
                      : `<span class="text-muted small"><i class="fas fa-times-circle text-danger"></i> Sin pixelada</span>`}
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;
        document.getElementById('contenido-tabla').innerHTML = tablaHtml;

        $('#tabla').DataTable({
          order: [[5, 'desc']],
          responsive: true,
          language: {
            search: "_INPUT_",
            searchPlaceholder: "Buscar...",
            lengthMenu: "Mostrar _MENU_ registros por página",
            zeroRecords: "No se encontraron registros",
            info: "Mostrando _START_ a _END_ de _TOTAL_ registros",
            infoEmpty: "No hay registros disponibles",
            infoFiltered: "(filtrado de _MAX_ registros totales)"
          }
        });

      } catch (error) {
        document.getElementById('contenido-tabla').innerHTML = `
          <div class="alert alert-danger">
            Error al cargar los datos.
          </div>`;
      }
    }

    document.addEventListener('DOMContentLoaded', cargarDatos);
  </script>
{% endblock %}
